name: Build Terra Sheet Builder

on:
  push:
    paths:
      - "tools/terra_sheet_builder/**"
    branches:
      - main
      - master
      - "claude/**"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-amd64
          - os: windows-latest
            label: windows-x64
          - os: macos-13
            label: macos-intel
          - os: macos-14
            label: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Qt6 xcb / EGL libs needed for PyInstaller to locate and bundle
      # the platform plugin on headless Linux runners.
      - name: Install Linux Qt system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libegl1 libgl1 libdbus-1-3

      - name: Install Python dependencies
        working-directory: tools/terra_sheet_builder
        run: pip install -r requirements.txt pyinstaller

      # ── Linux: single-file ELF, no windowed flag ──
      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: tools/terra_sheet_builder
        run: |
          pyinstaller \
            --onefile \
            --name AFI_SheetBuilder \
            terra_sheet_builder.py

      # ── Windows: single-file EXE, suppress console window ──
      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: tools/terra_sheet_builder
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name AFI_SheetBuilder `
            terra_sheet_builder.py

      # ── macOS: .app bundle (onedir is required for a proper .app) ──
      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: tools/terra_sheet_builder
        run: |
          pyinstaller \
            --onedir \
            --windowed \
            --name AFI_SheetBuilder \
            terra_sheet_builder.py

      # Zip .app so the upload preserves the bundle structure and symlinks
      - name: Zip macOS .app bundle
        if: runner.os == 'macOS'
        working-directory: tools/terra_sheet_builder/dist
        run: zip -r --symlinks AFI_SheetBuilder-${{ matrix.label }}.zip AFI_SheetBuilder.app

      # ── Upload artifacts ──
      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: AFI_SheetBuilder-${{ matrix.label }}
          path: tools/terra_sheet_builder/dist/AFI_SheetBuilder

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AFI_SheetBuilder-${{ matrix.label }}
          path: tools/terra_sheet_builder/dist/AFI_SheetBuilder.exe

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: AFI_SheetBuilder-${{ matrix.label }}
          path: tools/terra_sheet_builder/dist/AFI_SheetBuilder-${{ matrix.label }}.zip
